<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f3f1fa">
<title>数学讲解视频</title>
<style>
:root {
  --bg: #f3f1fa;
  --card: #ffffff;
  --ink: #1f2a37;
  --muted: #566273;
  --line: #e0dcef;
  --vid: #5b3fb5;
  --vid-bg: #ece7fa;
  --done: #2e8b62;
  --done-bg: #e4f4ea;
  --sun: #e9a31a;
  --f: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--f); font-size: 17px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
a { color: var(--vid); text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
::selection { background: #ddd3f7; }
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(28px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.back { font-weight: 700; font-size: 17px; display: inline-flex; align-items: center; min-height: 44px; }
h1 { margin: 0; font-size: 30px; line-height: 1.2; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 16px; }
.prog { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 18px; padding: 12px 16px; }
.prog b { font-size: 17px; }
.prog b em { font-style: normal; color: var(--done); font-size: 22px; margin: 0 2px; font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--done); border-radius: 99px; transition: width .4s cubic-bezier(.16, 1, .3, 1); }
.v { background: var(--card); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; border: 2px solid transparent; }
.v.done { border-color: var(--done); }
.head { display: flex; align-items: center; gap: 12px; }
.no { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--vid-bg); color: var(--vid); font-weight: 800; display: grid; place-items: center; }
.v.done .no { background: var(--done); color: #fff; }
.title { font-size: 19px; font-weight: 800; line-height: 1.3; }
.meta { font-size: 15px; color: var(--muted); }
video { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; background: #e8e5f2; }
.task { margin: 0; font-size: 16px; background: var(--vid-bg); border-radius: 12px; padding: 10px 12px; }
.task b { color: var(--vid); }
.row { display: flex; justify-content: flex-end; }
.mark { min-height: 44px; padding: 0 18px; border-radius: 12px; font-weight: 700; border: 2px solid var(--line); background: #fff; }
.v.done .mark { background: var(--done); border-color: var(--done); color: #fff; }
.foot { text-align: center; font-size: 15px; color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="../">‹ 学习首页</a>
  <header>
    <h1>数学讲解视频</h1>
    <p class="sub">每个 1 分钟左右，用期中练习的原题讲。看完先给妈妈讲一遍，再把试卷上那道题重做。</p>
  </header>
  <section class="prog" aria-label="观看进度"><b id="prog-t"></b><span class="bar"><i id="prog-bar"></i></span></section>
  <div id="list"></div>
  <p class="foot">建议：第 1 周看 1、2，第 2 周看 3、4，第 3 周看 5。</p>
</main>
<script>
(function () {
  var VIDEOS = [
    { id: 'v1-decimal-division', title: '小数除法三步走', len: '1 分钟', task: '重做 <b>11.4 ÷ 99</b> 和 <b>129.6 ÷ 2.7</b>，注意商中间的 0' },
    { id: 'v2-bigger-smaller', title: '乘除小于 1 的数，变大还是变小', len: '1 分 06 秒', task: '重做 <b>选择题第 3、6 题</b>和填空第 3 题的比大小' },
    { id: 'v3-shortcut-trap', title: '简便计算的陷阱', len: '54 秒', task: '重做 <b>20 ÷ (0.2 + 0.05)</b> 和 <b>0.24 × 15 + 1.6 × 1.5</b>' },
    { id: 'v4-water-bill', title: '阶梯水费：分段计费', len: '56 秒', task: '重做 <b>解决问题第 5 题</b>的两个小问' },
    { id: 'v5-word-problems', title: '线段图解应用题', len: '1 分 08 秒', task: '重做 <b>填空第 12 题</b>、<b>解决问题第 6 题</b>和瓷砖题' }
  ];
  var KEY = 'math-videos-watched', seen = {};
  try { seen = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { seen = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(seen)); } catch (e) {} }
  var CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var list = document.getElementById('list');

  // 每个视频建一次，之后只更新状态，播放不会被打断
  VIDEOS.forEach(function (v, i) {
    var el = document.createElement('section');
    el.className = 'v'; el.id = 'card-' + v.id;
    el.innerHTML = '<div class="head"><div class="no">' + (i + 1) + '</div><div><div class="title">' + v.title + '</div><div class="meta">' + v.len + '</div></div></div>' +
      '<video controls playsinline preload="none" poster="' + v.id + '.jpg" src="' + v.id + '.mp4"></video>' +
      '<p class="task">看完以后：' + v.task + '</p>' +
      '<div class="row"><button class="mark" type="button"></button></div>';
    el.querySelector('.mark').addEventListener('click', function () { seen[v.id] = !seen[v.id]; save(); update(); });
    el.querySelector('video').addEventListener('ended', function () { seen[v.id] = true; save(); update(); });
    list.appendChild(el);
  });
  function update() {
    var n = 0;
    VIDEOS.forEach(function (v, i) {
      var el = document.getElementById('card-' + v.id), done = !!seen[v.id];
      if (done) n++;
      el.className = 'v' + (done ? ' done' : '');
      el.querySelector('.no').innerHTML = done ? CHECK : String(i + 1);
      el.querySelector('.mark').textContent = done ? '已看完' : '我看完了';
    });
    document.getElementById('prog-t').innerHTML = '已看完<em>' + n + '</em>/ 5';
    document.getElementById('prog-bar').style.width = (n / VIDEOS.length * 100) + '%';
  }
  update();
  list.style.display = 'flex'; list.style.flexDirection = 'column'; list.style.gap = '14px';
})();
</script>
</body>
</html>
