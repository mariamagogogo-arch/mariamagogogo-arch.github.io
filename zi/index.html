<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f2f6f1">
<title>错别字本</title>
<style>
/* 田字格作业本：淡绿格线 + 老师的朱红批改 */
:root {
  --bg: #f2f6f1;
  --paper: #ffffff;
  --ink: #23272b;
  --muted: #69736d;
  --line: #dde7df;
  --soft: #f6f9f5;
  --grid: #8ec7a6;
  --grid-soft: #cfe7d8;
  --jade: #2e8b62;
  --jade-d: #23704e;
  --red: #d9412b;
  --red-bg: #fdecea;
  --ok-bg: #e4f4ea;
  --sun: #f2b134;
  --f: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --kai: "Kaiti SC", "STKaiti", "KaiTi", "楷体", "BiauKai", "Songti SC", serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--f); font-size: 17px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
button, input, textarea { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
a { color: var(--jade-d); text-decoration: none; }
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  padding-top: max(14px, env(safe-area-inset-top, 0px)); padding-bottom: max(28px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { background: var(--paper); border-radius: 18px; padding: 18px 16px; min-width: 0; box-shadow: 0 1px 0 var(--line); display: flex; flex-direction: column; gap: 12px; }
h1 { margin: 0; font: 700 34px/1.2 var(--kai); letter-spacing: .06em; }
h1 em { font-style: normal; color: var(--red); }
h2 { margin: 0; font-size: 16px; }
.mini { font-size: 13px; color: var(--muted); margin: 0; }
.topbar { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.back { font-weight: 700; color: var(--jade-d); padding: 6px 10px 6px 0; white-space: nowrap; }
.ttl { font-weight: 700; font-size: 18px; }
.prog { margin-left: auto; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }

.btn { display: block; width: 100%; min-height: 54px; border-radius: 14px; font-size: 18px; font-weight: 700; padding: 10px 16px; text-align: center; }
.btn.main { background: var(--jade); color: #fff; box-shadow: 0 4px 0 var(--jade-d); }
.btn.main:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--jade-d); }
.btn.main:disabled { background: var(--line); color: var(--muted); box-shadow: none; }
.btn.ghost { background: var(--paper); border: 2px solid var(--line); color: var(--jade-d); }
.btn.red { background: var(--red); color: #fff; }
.btn.small { min-height: 44px; font-size: 15px; background: var(--soft); border: 2px solid var(--line); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--paper); border-radius: 16px; padding: 12px 6px; text-align: center; display: flex; flex-direction: column; }
.tile b { font-size: 28px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tile.due b { color: var(--red); }
.tile span { font-size: 12px; color: var(--muted); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--soft); border: 2px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button { min-height: 40px; border-radius: 9px; font-weight: 700; color: var(--muted); font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--jade-d); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.more { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.more button { background: var(--soft); border: 2px solid var(--line); border-radius: 12px; padding: 10px 4px; font-size: 14px; font-weight: 700; display: flex; flex-direction: column; gap: 2px; }
.more button small { font-weight: 400; color: var(--muted); font-size: 12px; }
.more button:disabled { opacity: .45; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 12px; color: var(--muted); }
.week b { display: block; margin: 4px auto 0; width: 34px; height: 34px; border-radius: 50%; line-height: 30px; background: var(--soft); border: 2px solid var(--line); color: var(--ink); font-size: 13px; }
.week .on b { background: var(--ok-bg); border-color: var(--grid); color: var(--jade-d); }

/* 田字格 */
.grid-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.tzg { --b: 64px; position: relative; width: var(--b); height: var(--b); border: 2px solid var(--grid); background: var(--paper);
  display: grid; place-items: center; font: 400 calc(var(--b) * .72)/1 var(--kai); flex: none; }
.tzg::before, .tzg::after { content: ""; position: absolute; pointer-events: none; }
.tzg::before { left: 0; right: 0; top: 50%; border-top: 1px dashed var(--grid); }
.tzg::after { top: 0; bottom: 0; left: 50%; border-left: 1px dashed var(--grid); }
.tzg.blank { background: #fffbea; border-color: var(--sun); }
.tzg.ans { color: var(--red); }
.tzg span { position: relative; z-index: 1; }
.pads { display: flex; justify-content: center; gap: 8px; }
.pad-col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.pad { position: relative; }
.pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; z-index: 2; }
.py { text-align: center; font-size: 20px; letter-spacing: .1em; color: var(--jade-d); }
.warn { text-align: center; font-size: 15px; color: var(--muted); }
.warn s { color: var(--red); font: 22px var(--kai); }
.qlabel { text-align: center; font-weight: 700; }
.word-big { text-align: center; font: 400 44px/1.3 var(--kai); letter-spacing: .12em; }
.tipbox { background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { min-height: 84px; border-radius: 16px; border: 2px solid var(--line); background: var(--soft); font: 400 34px/1.2 var(--kai); letter-spacing: .08em; padding: 8px; }
.opt.ok { background: var(--jade); border-color: var(--jade); color: #fff; }
.opt.bad { background: var(--red); border-color: var(--red); color: #fff; }
.verdict { text-align: center; font-weight: 800; font-size: 20px; }
.verdict.ok { color: var(--jade-d); }
.verdict.bad { color: var(--red); }

/* 表单 */
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 15px; }
label.f small { font-weight: 400; color: var(--muted); }
input[type="text"], input[type="search"], textarea { width: 100%; border: 2px solid var(--line); border-radius: 12px; background: var(--soft); padding: 12px; font-size: 18px; }
input.big { font: 400 28px var(--kai); letter-spacing: .1em; text-align: center; }
textarea { font-size: 16px; resize: vertical; }
input:focus, textarea:focus { border-color: var(--jade); background: var(--paper); outline: none; }
.err { color: var(--red); font-size: 14px; margin: 0; min-height: 1em; }
details.batch summary { font-weight: 700; color: var(--jade-d); cursor: pointer; }
details.batch[open] summary { margin-bottom: 10px; }

/* 列表 */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 6px 12px; border-radius: 99px; background: var(--paper); border: 2px solid var(--line); font-size: 14px; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--jade); border-color: var(--jade); color: #fff; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.item { background: var(--paper); border-radius: 14px; overflow: hidden; }
.item > button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 14px; text-align: left; }
.item .w { font: 400 26px/1.2 var(--kai); letter-spacing: .06em; }
.item .b { font: 400 17px var(--kai); color: var(--red); text-decoration: line-through; }
.item .meta { margin-left: auto; text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }
.lv { display: inline-flex; gap: 3px; margin-top: 3px; }
.lv i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.lv i.on { background: var(--jade); }
.tag { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 99px; padding: 0 8px; }
.tag.due { background: var(--red-bg); color: var(--red); }
.tag.learn { background: #fff4d6; color: #9a6a00; }
.tag.done { background: var(--ok-bg); color: var(--jade-d); }
.edit { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.empty { text-align: center; color: var(--muted); padding: 20px 0; }
.sumstars { text-align: center; font-size: 22px; }
.sumstars b { font-size: 40px; color: var(--jade-d); }
.badlist { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.badlist span { font: 400 26px var(--kai); background: var(--red-bg); color: var(--red); border-radius: 10px; padding: 4px 12px; }
#toast { position: fixed; left: 50%; bottom: 30%; transform: translateX(-50%); z-index: 40; background: rgba(35,39,43,.92); color: #fff; padding: 10px 18px; border-radius: 12px; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 84%; text-align: center; }
#toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<main id="app" class="wrap"></main>
<div id="toast" role="status"></div>
<script>
'use strict';
/* 复习间隔（天）：记下后第1天复习，之后每次写对就隔 2、4、7、15、30 天再复习，全部通过算"已掌握" */
var INTERVALS = [1, 2, 4, 7, 15, 30];
var KEY = 'zi-book-v1';
var S, TODAY, view = 'home', sess = null, editId = null, filter = 'all', query = '', addErr = '', confirmDel = null;

function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function ymd(t) { return t.getFullYear() + '-' + pad2(t.getMonth() + 1) + '-' + pad2(t.getDate()); }
function parseYmd(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12); }
function addDays(s, k) { var t = parseYmd(s); t.setDate(t.getDate() + k); return ymd(t); }
function md(s) { var t = parseYmd(s); return (t.getMonth() + 1) + '月' + t.getDate() + '日'; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function chars(s) { return Array.from(s || ''); }
function isHan(s) { return /^[㐀-鿿豈-﫿〇]+$/.test(s); }
function load() { try { var o = JSON.parse(localStorage.getItem(KEY)); if (o && o.items) { o.log = o.log || {}; return o; } } catch (e) {} return { items: [], log: {}, mode: 'write' }; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function logDay(k, n) { var l = S.log[TODAY] = S.log[TODAY] || { add: 0, rev: 0, ok: 0 }; l[k] += n || 1; }
function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.className = 'show'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.className = ''; }, 1800); }

/* 写错的位置：两个写法一样长时，找出不同的字 */
function diffPos(w, b) {
  var a = chars(w), c = chars(b); if (!b || a.length !== c.length) return [];
  var r = []; for (var i = 0; i < a.length; i++) if (a[i] !== c[i]) r.push(i);
  return r.length === a.length ? [] : r;
}
function status(it) { return it.mastered ? 'done' : it.due <= TODAY ? 'due' : 'learn'; }
var STNAME = { due: '待复习', learn: '学习中', done: '已掌握' };
function dueItems() { return S.items.filter(function (it) { return status(it) === 'due'; }); }
function byId(id) { for (var i = 0; i < S.items.length; i++) if (S.items[i].id === id) return S.items[i]; return null; }

/* ---------- 记录 ---------- */
function addItem(w, b, py, tip) {
  w = (w || '').replace(/\s/g, ''); b = (b || '').replace(/\s/g, ''); py = (py || '').trim(); tip = (tip || '').trim();
  if (!w) return '先写上正确的字词。';
  if (!isHan(w)) return '“正确写法”只能填汉字，不要加标点和空格。';
  if (chars(w).length > 12) return '一次记一个字词就好（12个字以内）。';
  if (b && !isHan(b)) return '“我写成了”只能填汉字。';
  if (b === w) return '写错的样子和正确写法一样，检查一下。';
  var ex = null; S.items.forEach(function (it) { if (it.w === w) ex = it; });
  if (ex) {
    ex.wrong++; ex.lv = 0; ex.mastered = false; ex.due = addDays(TODAY, 1);
    if (b) ex.b = b; if (py) ex.py = py; if (tip) ex.tip = tip;
    logDay('add'); save(); return { again: true, it: ex };
  }
  var it = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), w: w, b: b, py: py, tip: tip, added: TODAY, lv: 0, due: addDays(TODAY, 1), wrong: 1, right: 0, mastered: false };
  S.items.push(it); logDay('add'); save(); return { it: it };
}
/* scheduled：只有到期复习时写对才往后排；任何时候写错都从头开始 */
function grade(it, ok, scheduled) {
  it.last = TODAY; logDay('rev'); if (ok) logDay('ok');
  if (ok) {
    it.right++;
    if (scheduled && it.due <= TODAY && !it.mastered) {
      it.lv++;
      if (it.lv >= INTERVALS.length) { it.mastered = true; it.due = null; }
      else it.due = addDays(TODAY, INTERVALS[it.lv]);
    }
  } else { it.wrong++; it.lv = 0; it.mastered = false; it.due = addDays(TODAY, 1); }
  save();
}

/* ---------- 页面 ---------- */
function render() {
  var h = view === 'add' ? vAdd() : view === 'list' ? vList() : view === 'practice' ? vPractice() : view === 'done' ? vDone() : vHome();
  document.getElementById('app').innerHTML = h;
  if (view === 'practice') setupPads();
}
function go(v) { view = v; addErr = ''; confirmDel = null; render(); window.scrollTo(0, 0); }

function vHome() {
  var due = dueItems().length, all = S.items.length, done = S.items.filter(function (it) { return it.mastered; }).length;
  var todayN = S.items.filter(function (it) { return it.added === TODAY; }).length, l = S.log[TODAY] || { add: 0, rev: 0 };
  var withB = S.items.filter(function (it) { return it.b && !it.mastered; }).length;
  var week = '';
  for (var k = 6; k >= 0; k--) { var d = addDays(TODAY, -k), g = S.log[d], n = g ? g.add + g.rev : 0; week += '<div class="' + (n ? 'on' : '') + '">' + '日一二三四五六'[parseYmd(d).getDay()] + '<b>' + (n || '') + '</b></div>'; }
  return '<div class="topbar"><a class="back" href="../">‹ 学习首页</a></div>' +
    '<header><h1>错<em>别</em>字本</h1><p class="mini">' + md(TODAY) + '　今天写错的字，记下来，按时复习，就不会再错。</p></header>' +
    '<section class="tiles"><div class="tile due"><b>' + due + '</b><span>今天要复习</span></div><div class="tile"><b>' + all + '</b><span>一共记了</span></div><div class="tile"><b>' + done + '</b><span>已经掌握</span></div></section>' +
    '<section class="card"><h2>① 记下今天写错的字</h2><p class="mini">' + (l.add ? '今天已经记了 ' + todayN + ' 个。' : '作业、听写、作文里写错的字，都记在这里。') + '</p>' +
    '<button class="btn ghost" data-act="add">记录错别字</button></section>' +
    '<section class="card"><h2>② 今日复习</h2><div class="seg" role="group" aria-label="练习方式">' +
    '<button data-act="mode" data-v="write" aria-pressed="' + (S.mode !== 'choose') + '">写一写</button><button data-act="mode" data-v="choose" aria-pressed="' + (S.mode === 'choose') + '">选一选</button></div>' +
    '<p class="mini">' + (S.mode === 'choose' ? '选一选：从两个写法里挑出正确的（只练记了“我写成了”的字词）。' : '写一写：在田字格里用手指写，写完自己对答案。也可以写在本子上。') + '</p>' +
    '<button class="btn main" data-act="review"' + (due ? '' : ' disabled') + '>' + (due ? '开始复习（' + due + ' 个）' : '今天没有要复习的字') + '</button></section>' +
    '<section class="card"><h2>更多练习</h2><div class="more">' +
    '<button data-act="extra" data-v="today"' + (todayN ? '' : ' disabled') + '>今天新记的<small>' + todayN + ' 个</small></button>' +
    '<button data-act="extra" data-v="hard"' + (all ? '' : ' disabled') + '>最常写错<small>前 10 个</small></button>' +
    '<button data-act="extra" data-v="rand"' + (all ? '' : ' disabled') + '>随便抽<small>10 个</small></button></div>' +
    '<p class="mini">更多练习不会改变复习时间，写错的字会安排明天再复习。</p></section>' +
    '<section class="card"><h2>最近 7 天（记录 + 复习的次数）</h2><div class="week">' + week + '</div></section>' +
    '<button class="btn ghost" data-act="list">字词本（全部 ' + all + ' 个）· 备份</button>';
}

function vAdd() {
  var rows = S.items.filter(function (it) { return it.added === TODAY; }).slice().reverse().map(function (it) {
    return '<li class="item"><button data-act="edit" data-id="' + it.id + '"><span class="w">' + esc(it.w) + '</span>' + (it.b ? '<span class="b">' + esc(it.b) + '</span>' : '') + '<span class="meta">明天复习</span></button></li>';
  }).join('');
  return '<div class="topbar"><button class="back" data-act="home">‹ 返回</button><span class="ttl">记录错别字</span></div>' +
    '<form class="card" id="addf" autocomplete="off">' +
    '<label class="f">正确的写法<input type="text" class="big" id="fw" lang="zh-CN" placeholder="例如：辨别" maxlength="12"></label>' +
    '<label class="f">我写成了 <small>（可以不填；填了能练“选一选”，还会标出写错的字）</small><input type="text" class="big" id="fb" lang="zh-CN" placeholder="例如：辩别" maxlength="12"></label>' +
    '<label class="f">拼音 <small>（可以不填）</small><input type="text" id="fp" placeholder="例如：biàn bié"></label>' +
    '<label class="f">记忆方法或例句 <small>（可以不填）</small><input type="text" id="ft" placeholder="例如：辨别要用眼睛看，中间是点撇"></label>' +
    '<p class="err" id="ferr">' + esc(addErr) + '</p><button class="btn main" type="submit">保存，接着记下一个</button></form>' +
    '<details class="card batch"><summary>一次记很多个</summary><p class="mini">每行一个：正确写法、空格、写错的样子（没有可以不写）。</p>' +
    '<textarea id="bt" rows="5" placeholder="辨别 辩别&#10;既然 即然&#10;再接再厉 再接再励&#10;赢"></textarea><button class="btn small" data-act="batch">全部保存</button></details>' +
    '<section class="card"><h2>今天记下的</h2>' + (rows ? '<ul class="list">' + rows + '</ul>' : '<p class="empty">还没有，先记一个吧。</p>') + '</section>';
}
function readInput(id) { var e = document.getElementById(id); return e ? e.value : ''; }

function vList() {
  var items = S.items.filter(function (it) { return (filter === 'all' || status(it) === filter) && (!query || it.w.indexOf(query) >= 0 || (it.b || '').indexOf(query) >= 0); });
  items.sort(function (a, b) { var o = { due: 0, learn: 1, done: 2 }; return o[status(a)] - o[status(b)] || (a.due || '').localeCompare(b.due || '') || b.wrong - a.wrong; });
  var chip = function (k, t) { return '<button class="chip" data-act="filter" data-v="' + k + '" aria-pressed="' + (filter === k) + '">' + t + '</button>'; };
  var rows = items.map(function (it) {
    var st = status(it), lv = ''; for (var i = 0; i < INTERVALS.length; i++) lv += '<i class="' + (i < it.lv || it.mastered ? 'on' : '') + '"></i>';
    var open = editId === it.id;
    return '<li class="item"><button data-act="edit" data-id="' + it.id + '" aria-expanded="' + open + '"><span class="w">' + esc(it.w) + '</span>' + (it.b ? '<span class="b">' + esc(it.b) + '</span>' : '') +
      '<span class="meta"><span class="tag ' + st + '">' + STNAME[st] + '</span><br>' + (it.mastered ? '' : md(it.due) + ' 复习') + '<br><span class="lv">' + lv + '</span></span></button>' +
      (open ? '<div class="edit"><p class="mini">' + md(it.added) + ' 记下 · 写错 ' + it.wrong + ' 次 · 写对 ' + it.right + ' 次</p>' +
        '<label class="f">正确的写法<input type="text" class="big" id="ew" value="' + esc(it.w) + '"></label>' +
        '<label class="f">我写成了<input type="text" class="big" id="eb" value="' + esc(it.b) + '"></label>' +
        '<label class="f">拼音<input type="text" id="ep" value="' + esc(it.py) + '"></label>' +
        '<label class="f">记忆方法或例句<input type="text" id="et" value="' + esc(it.tip) + '"></label>' +
        '<div class="row2"><button class="btn small" data-act="saveedit" data-id="' + it.id + '">保存修改</button><button class="btn small" data-act="redo" data-id="' + it.id + '">今天重新复习</button></div>' +
        (confirmDel === it.id ? '<div class="row2"><button class="btn small" data-act="delno">不删了</button><button class="btn red" data-act="delyes" data-id="' + it.id + '">确定删除</button></div>'
          : '<button class="btn small" data-act="del" data-id="' + it.id + '">删除这个词</button>') + '</div>' : '') + '</li>';
  }).join('');
  return '<div class="topbar"><button class="back" data-act="home">‹ 返回</button><span class="ttl">字词本</span></div>' +
    '<input type="search" id="q" placeholder="搜索字词" value="' + esc(query) + '">' +
    '<div class="chips">' + chip('all', '全部') + chip('due', '待复习') + chip('learn', '学习中') + chip('done', '已掌握') + '</div>' +
    (rows ? '<ul class="list">' + rows + '</ul>' : '<p class="empty">' + (S.items.length ? '没有符合的字词。' : '还没有记录。') + '</p>') +
    '<section class="card"><h2>备份 / 换手机</h2><p class="mini">复制备份数据发给自己（比如微信文件传输助手），换手机后粘贴到下面的框里导入。</p>' +
    '<textarea id="bk" rows="3" readonly>' + esc(JSON.stringify(S)) + '</textarea><button class="btn small" data-act="copy">复制备份数据</button>' +
    '<textarea id="imp" rows="3" placeholder="把备份数据粘贴到这里"></textarea><button class="btn small" data-act="import">导入备份</button></section>';
}

/* ---------- 练习 ---------- */
function startSession(list, scheduled, mode) {
  if (!list.length) { toast('没有可以练习的字词'); return; }
  sess = { q: list.map(function (it) { return it.id; }), i: 0, scheduled: scheduled, mode: mode, ok: 0, bad: [], phase: null };
  prepare(); go('practice');
}
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function prepare() {
  var it = byId(sess.q[sess.i]);
  var m = sess.mode === 'choose' && it.b ? 'choose' : 'write';
  var dp = diffPos(it.w, it.b), n = chars(it.w).length;
  var targets = dp.length ? dp : Array.from({ length: n }, function (_, i) { return i; });
  sess.cur = { it: it, m: m, targets: targets, partial: dp.length > 0, phase: m === 'write' && !dp.length && !it.py ? 'look' : 'write', opts: shuffle([it.w, it.b]), picked: null };
}
function vPractice() {
  var c = sess.cur, it = c.it, cs = chars(it.w), total = sess.q.length;
  var head = '<div class="topbar"><button class="back" data-act="home">‹ 结束</button><span class="ttl">' + (sess.scheduled ? '今日复习' : '练习') + '</span><span class="prog">' + (sess.i + 1) + ' / ' + total + '</span></div>';
  if (c.m === 'choose') {
    var opts = c.opts.map(function (o) {
      var cls = ''; if (c.picked != null) { if (o === it.w) cls = ' ok'; else if (o === c.picked) cls = ' bad'; }
      return '<button class="opt' + cls + '" data-act="pick" data-v="' + esc(o) + '"' + (c.picked != null ? ' disabled' : '') + '>' + esc(o) + '</button>';
    }).join('');
    var after = c.picked == null ? '' : '<p class="verdict ' + (c.picked === it.w ? 'ok' : 'bad') + '">' + (c.picked === it.w ? '选对了！' : '选错了，正确的是「' + esc(it.w) + '」') + '</p>' +
      (it.tip ? '<div class="tipbox">记一记：' + esc(it.tip) + '</div>' : '') + '<button class="btn main" data-act="next">' + (sess.i + 1 < total ? '下一个' : '看结果') + '</button>';
    return head + '<section class="card"><p class="qlabel">哪个写法是正确的？</p>' + (it.py ? '<p class="py">' + esc(it.py) + '</p>' : '') + '<div class="opts">' + opts + '</div>' + after + '</section>';
  }
  var prompt;
  if (c.phase === 'look') {
    return head + '<section class="card"><p class="qlabel">先看清楚，记住每一笔</p><div class="grid-row">' + cs.map(function (ch) { return '<div class="tzg" style="--b:' + boxSize(cs.length) + 'px"><span>' + esc(ch) + '</span></div>'; }).join('') + '</div>' +
      (it.tip ? '<div class="tipbox">记一记：' + esc(it.tip) + '</div>' : '') + '<button class="btn main" data-act="hide">记住了，盖住默写</button></section>';
  }
  var b = boxSize(cs.length);
  prompt = '<div class="grid-row">' + cs.map(function (ch, i) {
    var t = c.targets.indexOf(i) >= 0;
    return '<div class="tzg' + (t ? ' blank' : '') + '" style="--b:' + Math.min(b, 56) + 'px">' + (t ? '' : '<span>' + esc(ch) + '</span>') + '</div>';
  }).join('') + '</div>';
  var hintB = c.partial ? '<p class="warn">注意，别再写成 ' + c.targets.map(function (i) { return '<s>' + esc(chars(it.b)[i]) + '</s>'; }).join(' ') + '</p>' : '';
  var label = c.partial ? '把黄色格子里的字写出来' : it.py ? '看拼音，写出这个词' : '默写刚才的字词';
  var pb = padSize(c.targets.length);
  var pads = '<div class="pads">' + c.targets.map(function (i, k) {
    return '<div class="pad-col"><div class="tzg pad" style="--b:' + pb + 'px"><canvas id="cv' + k + '"></canvas></div>' +
      (c.phase === 'reveal' ? '<div class="tzg ans" style="--b:' + pb + 'px"><span>' + esc(cs[i]) + '</span></div>' : '') + '</div>';
  }).join('') + '</div>';
  var foot = c.phase === 'reveal'
    ? '<p class="qlabel">红色是正确答案。和你写的一样吗？</p><p class="word-big">' + esc(it.w) + '</p>' + (it.tip ? '<div class="tipbox">记一记：' + esc(it.tip) + '</div>' : '') +
      '<div class="row2"><button class="btn red" data-act="self" data-v="0">写错了</button><button class="btn main" data-act="self" data-v="1">写对了</button></div>'
    : '<div class="row2"><button class="btn small" data-act="clear">擦掉重写</button><button class="btn main" data-act="reveal">对答案</button></div>';
  return head + '<section class="card"><p class="qlabel">' + label + '</p>' + (it.py ? '<p class="py">' + esc(it.py) + '</p>' : '') + prompt + hintB + pads + foot + '</section>';
}
function boxSize(n) { var w = Math.min(window.innerWidth, 480) - 64; return Math.max(44, Math.min(72, Math.floor((w - (n - 1) * 8) / n))); }
function padSize(n) { var w = Math.min(window.innerWidth, 480) - 64; return Math.max(64, Math.min(150, Math.floor((w - (n - 1) * 8) / n))); }
var inks = {};
function setupPads() {
  var c = sess.cur; if (c.m !== 'write' || c.phase === 'look') return;
  c.targets.forEach(function (_, k) {
    var cv = document.getElementById('cv' + k); if (!cv) return;
    var size = cv.parentNode.clientWidth, dpr = window.devicePixelRatio || 1;
    cv.width = size * dpr; cv.height = size * dpr;
    var ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(4, size / 24); ctx.strokeStyle = ctx.fillStyle = '#23272b';
    if (inks[k]) { var img = new Image(); img.onload = function () { ctx.drawImage(img, 0, 0, size, size); }; img.src = inks[k]; }
    var down = false, last = null;
    function pos(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    function end() { if (down) { down = false; inks[k] = cv.toDataURL(); } }
    cv.addEventListener('pointerdown', function (e) { if (c.phase === 'reveal') return; down = true; last = pos(e); try { cv.setPointerCapture(e.pointerId); } catch (x) {} ctx.beginPath(); ctx.arc(last.x, last.y, ctx.lineWidth / 2, 0, 7); ctx.fill(); e.preventDefault(); });
    cv.addEventListener('pointermove', function (e) { if (!down) return; var p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; e.preventDefault(); });
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
  });
}
function nextItem() {
  inks = {};
  sess.i++;
  if (sess.i >= sess.q.length) { go('done'); return; }
  prepare(); render(); window.scrollTo(0, 0);
}
function record(ok) {
  var it = sess.cur.it; grade(it, ok, sess.scheduled);
  if (ok) sess.ok++; else sess.bad.push(it.id);
}
function vDone() {
  var n = sess.q.length, bads = sess.bad.map(byId).filter(Boolean);
  var msg = sess.ok === n ? '全部写对，太棒了！' : '写错的字已经安排明天再复习。';
  return '<div class="topbar"><button class="back" data-act="home">‹ 返回</button><span class="ttl">练习结果</span></div>' +
    '<section class="card"><p class="sumstars">写对 <b>' + sess.ok + '</b> / ' + n + '</p><p class="qlabel">' + msg + '</p>' +
    (bads.length ? '<p class="mini" style="text-align:center">这些还要多练：</p><div class="badlist">' + bads.map(function (it) { return '<span>' + esc(it.w) + '</span>'; }).join('') + '</div>' +
      '<button class="btn main" data-act="again">写错的再练一遍</button>' : '') +
    '<button class="btn ghost" data-act="home">回到错别字本</button></section>';
}

/* ---------- 事件 ---------- */
function submitAdd() {
  var r = addItem(readInput('fw'), readInput('fb'), readInput('fp'), readInput('ft'));
  if (typeof r === 'string') { addErr = r; document.getElementById('ferr').textContent = r; return; }
  addErr = ''; render();
  toast(r.again ? '「' + r.it.w + '」以前也写错过，已重新安排复习' : '已记下「' + r.it.w + '」，明天复习');
  var f = document.getElementById('fw'); if (f) f.focus();
}
function boot() {
  var m = /[?&]date=(\d{4}-\d{2}-\d{2})/.exec(location.search);   // 测试用：?date=2026-11-01
  TODAY = m ? m[1] : ymd(new Date());
  S = load();
  document.addEventListener('submit', function (e) { e.preventDefault(); if (e.target.id === 'addf') submitAdd(); });
  document.addEventListener('input', function (e) { if (e.target.id === 'q') { query = e.target.value.trim(); var pos = e.target.selectionStart; render(); var q = document.getElementById('q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (x) {} } });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
    var a = t.getAttribute('data-act'), v = t.getAttribute('data-v'), id = t.getAttribute('data-id');
    switch (a) {
      case 'home': go('home'); break;
      case 'add': go('add'); break;
      case 'list': editId = null; go('list'); break;
      case 'mode': S.mode = v; save(); render(); break;
      case 'review':
        var due = shuffle(dueItems());
        if (S.mode === 'choose' && !due.some(function (it) { return it.b; })) toast('这些字词没有填“我写成了”，改用写一写');
        startSession(due, true, S.mode); break;
      case 'extra':
        var list = v === 'today' ? S.items.filter(function (it) { return it.added === TODAY; })
          : v === 'hard' ? S.items.slice().sort(function (x, y) { return y.wrong - x.wrong; }).slice(0, 10)
          : shuffle(S.items).slice(0, 10);
        startSession(shuffle(list), false, S.mode); break;
      case 'hide': sess.cur.phase = 'write'; render(); break;
      case 'clear': inks = {}; render(); break;
      case 'reveal':
        if (!Object.keys(inks).length && !sess.cur.wroteOnPaper) { sess.cur.wroteOnPaper = true; toast('先写一写，写在本子上也可以。写好了再点“对答案”'); break; }
        sess.cur.phase = 'reveal'; render(); break;
      case 'self': record(v === '1'); nextItem(); break;
      case 'pick': sess.cur.picked = v; record(v === sess.cur.it.w); render(); break;
      case 'next': nextItem(); break;
      case 'again': startSession(sess.bad.map(byId).filter(Boolean), false, sess.mode); break;
      case 'batch':
        var lines = readInput('bt').split(/\n/), okN = 0, errs = [];
        lines.forEach(function (ln) { ln = ln.trim(); if (!ln) return; var p = ln.split(/[\s,，、]+/); var r = addItem(p[0], p[1] || ''); if (typeof r === 'string') errs.push(ln + '：' + r); else okN++; });
        addErr = errs.join('\n'); render(); toast('保存了 ' + okN + ' 个' + (errs.length ? '，有 ' + errs.length + ' 行没保存' : '')); break;
      case 'edit': editId = editId === id ? null : id; confirmDel = null; if (view === 'add') { view = 'list'; editId = id; } render(); break;
      case 'filter': filter = v; editId = null; render(); break;
      case 'saveedit':
        var it = byId(id), w = readInput('ew').replace(/\s/g, ''), b = readInput('eb').replace(/\s/g, '');
        if (!isHan(w) || (b && !isHan(b)) || b === w) { toast('写法只能填汉字，而且错写不能和正确写法一样'); break; }
        it.w = w; it.b = b; it.py = readInput('ep').trim(); it.tip = readInput('et').trim(); save(); toast('已保存'); render(); break;
      case 'redo': var r2 = byId(id); r2.due = TODAY; r2.mastered = false; r2.lv = Math.min(r2.lv, INTERVALS.length - 1); save(); toast('已加入今天的复习'); render(); break;
      case 'del': confirmDel = id; render(); break;
      case 'delno': confirmDel = null; render(); break;
      case 'delyes': S.items = S.items.filter(function (x) { return x.id !== id; }); editId = null; confirmDel = null; save(); toast('已删除'); render(); break;
      case 'copy':
        var el = document.getElementById('bk');
        var fb = function () { el.removeAttribute('readonly'); el.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (x) {} el.setAttribute('readonly', ''); toast(ok ? '已复制' : '已选中，长按选择“复制”'); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(el.value).then(function () { toast('已复制'); }, fb); else fb();
        break;
      case 'import':
        try { var o = JSON.parse(readInput('imp')); if (!o || !Array.isArray(o.items)) throw 0; o.log = o.log || {}; S = o; save(); toast('导入成功，共 ' + S.items.length + ' 个字词'); go('home'); }
        catch (x) { toast('数据格式不对，请粘贴完整的备份数据'); }
        break;
    }
  });
  render();
}
boot();
</script>
</body>
