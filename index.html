<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的学习乐园</title>
<style>
  :root {
    --bg: #fff8ee;
    --ink: #2d2a32;
    --muted: #7a7380;
    --card: #ffffff;
    --shadow: 0 6px 0 rgba(45, 42, 50, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    background-image: radial-gradient(#f3e3c8 1.5px, transparent 1.5px);
    background-size: 22px 22px;
    color: var(--ink);
    min-height: 100vh;
    padding: 28px 16px 40px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 28px; }
  .hello { font-size: 15px; color: var(--muted); margin-bottom: 6px; }
  h1 { font-size: 30px; letter-spacing: 1px; }
  h1 span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  .date {
    display: inline-block; margin-top: 12px; padding: 6px 14px;
    background: #ffe2a8; border-radius: 999px; font-size: 14px; font-weight: 600;
  }
  .quote { margin-top: 12px; font-size: 14px; color: var(--muted); }

  .grid { display: grid; gap: 16px; }
  .card {
    display: flex; align-items: center; gap: 16px;
    padding: 18px; border-radius: 20px;
    background: var(--card); border: 3px solid var(--ink);
    box-shadow: var(--shadow);
    text-decoration: none; color: var(--ink);
    transition: transform .12s, box-shadow .12s;
  }
  .card:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(45,42,50,.12); }
  .icon {
    flex: none; width: 64px; height: 64px; border-radius: 16px;
    display: grid; place-items: center; font-size: 34px;
    border: 3px solid var(--ink);
  }
  .info { flex: 1; min-width: 0; }
  .info h2 { font-size: 20px; margin-bottom: 4px; }
  .info p { font-size: 14px; color: var(--muted); line-height: 1.5; }
  .go { font-size: 26px; font-weight: 700; }

  .soon { opacity: .55; pointer-events: none; border-style: dashed; }
  .tag {
    display: inline-block; font-size: 12px; padding: 2px 8px; margin-left: 6px;
    border-radius: 6px; background: #eee; color: var(--muted); vertical-align: middle;
  }

  footer { text-align: center; margin-top: 32px; font-size: 13px; color: var(--muted); }

  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hello" id="hello">你好呀！</div>
    <h1><span>📚</span> 我的学习乐园</h1>
    <div class="date" id="date"></div>
    <div class="quote" id="quote"></div>
  </header>

  <main class="grid" id="grid"></main>

  <footer>每天进步一点点 ✨</footer>
</div>

<script>
  /* ========= 在这里添加或修改学习工具 =========
     每个工具一行，照着格式复制一行改内容即可。
     link 留空 "" 表示"即将上线"。                */
  const tools = [
    { icon: "🔢", color: "#bfe3ff", title: "计算练习", desc: "每天 5 道题，越算越快",   link: "https://mariamagogogo-arch.github.io/math5/" },
    { icon: "🔤", color: "#c8f2c2", title: "单词记忆", desc: "背单词、拼单词、闯关卡", link: "https://mariamagogogo-arch.github.io/w5-words/" },
    { icon: "📝", color: "#ffe2a8", title: "错字本",   desc: "记错字、按时复习",       link: "cuozi.html" },
    { icon: "📺", color: "#d9cfff", title: "数学讲解视频", desc: "期中错题，5 个 1 分钟动画", link: "videos.html" },
    { icon: "✏️", color: "#ffd6d6", title: "作文小助手", desc: "敬请期待",               link: "" },
  ];

  /* 错字本：显示今天要复习几个 */
  try {
    const t = new Date();
    const d = t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
    const due = JSON.parse(localStorage.getItem("cuozi-v1") || "[]").filter(x => !x.done && x.due <= d).length;
    if (due > 0) {
      const c = tools.find(x => x.link === "cuozi.html");
      c.desc = `🔔 今天要复习 ${due} 个字词`;
      c.link = "cuozi.html#review";
    }
  } catch (e) {}
  /* ============================================ */

  const grid = document.getElementById("grid");
  tools.forEach(t => {
    const ready = t.link !== "";
    const el = document.createElement(ready ? "a" : "div");
    el.className = "card" + (ready ? "" : " soon");
    if (ready) el.href = t.link;
    el.innerHTML = `
      <div class="icon" style="background:${t.color}">${t.icon}</div>
      <div class="info">
        <h2>${t.title}${ready ? "" : '<span class="tag">即将上线</span>'}</h2>
        <p>${t.desc}</p>
      </div>
      <div class="go">${ready ? "›" : ""}</div>`;
    grid.appendChild(el);
  });

  const now = new Date();
  const week = ["日", "一", "二", "三", "四", "五", "六"];
  document.getElementById("date").textContent =
    `${now.getMonth() + 1}月${now.getDate()}日 · 星期${week[now.getDay()]}`;

  const h = now.getHours();
  document.getElementById("hello").textContent =
    h < 12 ? "早上好！☀️" : h < 18 ? "下午好！🌤️" : "晚上好！🌙";

  const quotes = [
    "做完再检查一遍，会更棒哦！",
    "错题是最好的老师。",
    "慢慢来，比较快。",
    "今天也要认真对待每一道题！",
    "坚持就是超能力 💪",
  ];
  document.getElementById("quote").textContent = quotes[now.getDate() % quotes.length];
</script>
</body>
</html>
